name: ncsbot

x-ncsbot: &ncsbot
  build:
    context: .
    dockerfile: ./docker/Dockerfile
  image: ncsbot/ncsbot:local
  env_file: .env
  volumes:
    - ncsbot_storage:/app/storage

services:
  ncsbot-web:
    <<: *ncsbot
    container_name: ncsbot-web
    depends_on:
      ncsbot-postgres:
        condition: service_healthy
      ncsbot-redis:
        condition: service_healthy
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  ncsbot-worker:
    <<: *ncsbot
    container_name: ncsbot-worker
    depends_on:
      ncsbot-postgres:
        condition: service_healthy
      ncsbot-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  ncsbot-postgres:
    image: pgvector/pgvector:pg16
    container_name: ncsbot-postgres
    environment:
      POSTGRES_DB: ncsbot
      POSTGRES_USER: ncsbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ncsbot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncsbot -d ncsbot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ncsbot-redis:
    image: redis:alpine
    container_name: ncsbot-redis
    env_file: .env
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ncsbot_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  ncsbot_storage:
    name: ncsbot_storage
  ncsbot_postgres:
    name: ncsbot_postgres
  ncsbot_redis:
    name: ncsbot_redis
