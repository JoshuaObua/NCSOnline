user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    limit_req_zone $binary_remote_addr zone=intranet_api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=intranet_auth_limit:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://backend:8080";
        set $geo_gate "http://location-service:8090/gate";
        set $frontend "http://frontend:80";

        location = /health {
            proxy_pass $backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location = /healthz {
            proxy_pass $backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location = /readyz {
            proxy_pass $backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location = /metrics {
            return 404;
        }

        location = /ncs-ussd {
            limit_req zone=intranet_auth_limit burst=10 nodelay;
            proxy_pass $geo_gate$request_uri;
            include /etc/nginx/conf.d/proxy_params.conf;
            add_header Cache-Control "no-store" always;
        }

        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /api/v1/auth/ {
            limit_req zone=intranet_auth_limit burst=5 nodelay;
            proxy_pass $geo_gate$request_uri;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=intranet_api_limit burst=20 nodelay;
            proxy_pass $geo_gate$request_uri;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location / {
            proxy_pass $frontend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
