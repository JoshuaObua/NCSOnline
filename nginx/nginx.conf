user ${NGINX_USER};
worker_processes ${NGINX_WORKER_PROCESSES};
error_log ${NGINX_ERROR_LOG} ${NGINX_LOG_LEVEL};
pid ${NGINX_PID};

events {
    worker_connections ${NGINX_WORKER_CONNECTIONS};
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log ${NGINX_ACCESS_LOG} main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout ${NGINX_KEEPALIVE_TIMEOUT};
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level ${NGINX_GZIP_COMP_LEVEL};
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Two zones: a strict one for public/unauthenticated endpoints (brute-force
    # sensitive — login, public content reads), and a lenient one for the
    # authenticated CMS admin area, which legitimately fires dozens of parallel
    # requests on a single dashboard load/section switch.
    limit_req_zone $binary_remote_addr zone=website_cms_limit:${NGINX_PUBLIC_RATE_ZONE_SIZE} rate=${NGINX_PUBLIC_RATE};
    limit_req_zone $binary_remote_addr zone=website_admin_limit:${NGINX_ADMIN_RATE_ZONE_SIZE} rate=${NGINX_ADMIN_RATE};

    server {
        listen ${NGINX_LISTEN_PORT};
        listen ${NGINX_HTTPS_PORT} ssl;
        server_name ${NGINX_SERVER_NAME};

        ssl_certificate /etc/letsencrypt/live/ncsweb.atenimedia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ncsweb.atenimedia.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        resolver ${NGINX_RESOLVER} valid=${NGINX_RESOLVER_VALID} ipv6=off;
        set $backend "${BACKEND_INTERNAL_URL}";
        set $frontend "${FRONTEND_INTERNAL_URL}";
        set $ncsbot "http://ncsbot-web:3000";
        set $portal "http://ncsportal-backend-1:8080";

        # Public NCSBot inbox API only. The prefix is removed before the
        # request reaches NCSBot; no administrative API is exposed here.
        location /ncsbot/public/api/v1/inboxes/ {
            rewrite ^/ncsbot/(.*)$ /$1 break;
            proxy_pass $ncsbot;
            include /etc/nginx/proxy_params.conf;
        }

        # Same-origin access to public portal content used on the home page.
        location /portal-api/ {
            rewrite ^/portal-api/(.*)$ /$1 break;
            proxy_pass $portal;
            include /etc/nginx/proxy_params.conf;
        }

        location = /health {
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
            access_log off;
        }

        location = /healthz {
            proxy_pass $backend;
            include /etc/nginx/proxy_params.conf;
            access_log off;
        }

        location /uploads/ {
            alias ${NGINX_UPLOADS_PATH};
            expires ${NGINX_UPLOADS_CACHE_TTL};
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /api/v1/system/maintenance-status {
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/cms/ {
            limit_req zone=website_cms_limit burst=${NGINX_CMS_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/auth/ {
            limit_req zone=website_cms_limit burst=${NGINX_AUTH_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/admin/cms/ {
            limit_req zone=website_admin_limit burst=${NGINX_ADMIN_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/admin/media/upload {
            limit_req zone=website_admin_limit burst=${NGINX_UPLOAD_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        # Website back-office API (auth + RBAC + geo enforced by the backend):
        # roles, permissions, audit-logs, users, dashboard, storage-settings,
        # system, forms, etc. More specific /admin/cms/ and /admin/media/upload
        # locations above still win by longest-prefix match.
        location /api/v1/admin/ {
            limit_req zone=website_admin_limit burst=${NGINX_ADMIN_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/media/upload {
            limit_req zone=website_admin_limit burst=${NGINX_UPLOAD_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        # These modules belong to the separate intranet product served from
        # the same backend binary and are intentionally not exposed through
        # the public website gateway. Anchored to a full path segment
        # (trailing "/" or end-of-string) so this can't partial-match other
        # routes sharing a prefix (e.g. "me" must not swallow "media"/"messages").
        location ~ ^/api/v1/(applications|nsmis|users|roles|transactions|organisations)(/|$) {
            return 404;
        }

        # Catch-all for authenticated routes without a more specific block above
        # (notifications, messages, me/*, portal/*, departments, account/*) —
        # all backend-auth-gated already, so the lenient admin zone applies.
        location /api/ {
            limit_req zone=website_admin_limit burst=${NGINX_ADMIN_RATE_BURST} nodelay;
            proxy_pass $backend$request_uri;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass $frontend;
            include /etc/nginx/proxy_params.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
