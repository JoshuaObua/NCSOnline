user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # 1. NCSPORTAL Host Server Block (ncsportal.atenimedia.com)
    server {
        listen 80;
        listen 443 ssl;
        server_name ncsportal.atenimedia.com;

        ssl_certificate /etc/letsencrypt/live/ncsweb.atenimedia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ncsweb.atenimedia.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $portal_backend "http://ncsportal-backend-1:8080";
        set $portal_frontend "http://ncsportal-frontend-1:80";

        location /api/ {
            proxy_pass $portal_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /uploads/ {
            proxy_pass $portal_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass $portal_frontend;
            include /etc/nginx/proxy_params.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 2. NCSINTRANET Host Server Block (ncsintranet.atenimedia.com)
    server {
        listen 80;
        listen 443 ssl;
        server_name ncsintranet.atenimedia.com;

        ssl_certificate /etc/letsencrypt/live/ncsweb.atenimedia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ncsweb.atenimedia.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $intranet_backend "http://ncsintranet-backend-1:8080";
        set $intranet_frontend "http://ncsintranet-frontend-1:80";

        location /api/ {
            proxy_pass $intranet_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /uploads/ {
            proxy_pass $intranet_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass $intranet_frontend;
            include /etc/nginx/proxy_params.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 3. NCSWEB Main Website Host Server Block (ncsweb.atenimedia.com)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name ncsweb.atenimedia.com localhost _;

        ssl_certificate /etc/letsencrypt/live/ncsweb.atenimedia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ncsweb.atenimedia.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $website_backend "http://ncswebsite-backend-1:8080";
        set $website_frontend "http://ncswebsite-frontend-1:80";
        set $ncsbot "http://ncsbot-web:3000";
        set $portal "http://ncsportal-backend-1:8080";

        location /ncsbot/public/api/v1/inboxes/ {
            rewrite ^/ncsbot/(.*)$ /$1 break;
            proxy_pass $ncsbot;
            include /etc/nginx/proxy_params.conf;
        }

        location /portal-api/ {
            rewrite ^/portal-api/(.*)$ /$1 break;
            proxy_pass $portal;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            proxy_pass $website_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location /uploads/ {
            proxy_pass $website_backend;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass $website_frontend;
            include /etc/nginx/proxy_params.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
