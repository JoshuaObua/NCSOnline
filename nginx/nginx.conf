user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Hide Server Version ───────────────────────────────────────────
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Rate Limiting Zones ───────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=intranet_api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=intranet_auth_limit:10m rate=10r/m;
    limit_req_status 429;

    # ── Security Headers (applied globally) ───────────────────────────
    # HSTS: Force HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy — disable dangerous browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content Security Policy — restrictive default
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    server {
        listen 80;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://backend:8080";
        set $geo_gate "http://location-service:8090/gate";
        set $frontend "http://frontend:80";

        # ── Health Check Endpoints (no security headers to avoid caching issues) ──
        location = /health {
            proxy_pass $backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location = /healthz {
            proxy_pass $backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        location = /readyz {
            proxy_pass $backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        # ── Block Sensitive Paths ─────────────────────────────────────
        location = /metrics {
            return 404;
        }

        # ── USSD Callback Endpoint ────────────────────────────────────
        location = /ncs-ussd {
            limit_req zone=intranet_auth_limit burst=10 nodelay;
            proxy_pass $geo_gate$request_uri;
            include /etc/nginx/conf.d/proxy_params.conf;
            add_header Cache-Control "no-store" always;
        }

        # ── Static Uploads ────────────────────────────────────────────
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Auth API (stricter rate limit) ────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=intranet_auth_limit burst=5 nodelay;
            proxy_pass $geo_gate$request_uri;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── General API ──────────────────────────────────────────────
        location /api/ {
            limit_req zone=intranet_api_limit burst=20 nodelay;
            proxy_pass $geo_gate$request_uri;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Frontend SPA ─────────────────────────────────────────────
        location / {
            proxy_pass $frontend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
