user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # ── Gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Rate Limiting Zones ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    # ── Upstream Backend ───────────────────────────────────────────
    upstream ncsms_backend {
        server backend:8080;
        keepalive 32;
    }

    # ── HTTP Server (development / pre-SSL) ───────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge (for future SSL setup)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check — no rate limiting
        location = /health {
            proxy_pass http://ncsms_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        # Auth endpoints — strict rate limit (10 req/min)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://ncsms_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # All other API endpoints — standard rate limit (100 req/min)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ncsms_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Catch-all fallback
        location / {
            proxy_pass http://ncsms_backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }

    # ── HTTPS Server ───────────────────────────────────────────────
    # Uncomment and configure when SSL certificates are available:
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options DENY always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     location = /health {
    #         proxy_pass http://ncsms_backend;
    #         include /etc/nginx/conf.d/proxy_params.conf;
    #         access_log off;
    #     }
    #
    #     location /api/v1/auth/ {
    #         limit_req zone=auth_limit burst=5 nodelay;
    #         proxy_pass http://ncsms_backend;
    #         include /etc/nginx/conf.d/proxy_params.conf;
    #     }
    #
    #     location /api/ {
