name: CI
on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
permissions:
  contents: read
  security-events: write
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: gofmt -l . | tee /tmp/gofmt && test ! -s /tmp/gofmt
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/location_service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/location_service/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build backend nsmis-worker frontend location-service
      - run: bash scripts/check-deploy-safety.sh
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ncs-online.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: ncs-online.spdx.json }
