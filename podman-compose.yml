# Podman Compose configuration for NCS Intranet & Online Platform
# Run with: podman-compose up -d --build
# Or with standard podman: podman compose up -d --build

name: ncsintranet

services:
  postgres:
    image: postgres:16-alpine
    container_name: ncs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncsintranet}
      POSTGRES_USER: ${POSTGRES_USER:-ncsintranet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NcsIntranetDb2026!Secure}
    volumes:
      - intranet_postgres_data:/var/lib/postgresql/data:Z
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncsintranet_user} -d ${POSTGRES_DB:-ncsintranet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ncsintranet_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ncs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ncsintranet_user}:${POSTGRES_PASSWORD:-NcsIntranetDb2026!Secure}@postgres:5432/${POSTGRES_DB:-ncsintranet}?sslmode=disable
      PORT: 8080
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:9081}
    volumes:
      - intranet_uploads_data:/app/uploads:Z
      - intranet_private_data:/app/private-data:Z
      - intranet_app_logs:/var/log/app:Z
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ncsintranet_net

  location-service:
    build:
      context: ./services/location_service
    container_name: ncs_location_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GEO_UPSTREAM_URL: http://backend:8080
      GEO_FRONTEND_URL: http://frontend:80
      GEOIP_DB_PATH: /data/GeoLite2-City.mmdb
      GEO_WHITELIST_PATH: /config/geo-whitelist.json
    volumes:
      - intranet_geoip_data:/data:Z
      - ./services/location_service/config:/config:ro,Z
    expose:
      - "8090"
    networks:
      - ncsintranet_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9081}
    container_name: ncs_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ncsintranet_net

  nginx:
    image: nginx:1.25-alpine
    container_name: ncs_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - location-service
    ports:
      - "9081:80"
      - "9444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,Z
      - intranet_nginx_logs:/var/log/nginx:Z
      - intranet_uploads_data:/app/uploads:ro,Z
    networks:
      - ncsintranet_net

volumes:
  intranet_postgres_data:
  intranet_nginx_logs:
  intranet_uploads_data:
  intranet_private_data:
  intranet_geoip_data:
  intranet_app_logs:

networks:
  ncsintranet_net:
    driver: bridge
