services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncsms}
      POSTGRES_USER: ${POSTGRES_USER:-ncsms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncsms_user} -d ${POSTGRES_DB:-ncsms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ncsms_net

  # ── Backend API ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ncsms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ncsms}?sslmode=disable
      PORT: 8080
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ncs-online}
      # GITHUB_REPO_SLUG: owner/repo — defaults to atenimedia-llc/ncs-online.
      # GITHUB_TOKEN: optional, only needed if you hit the unauthenticated
      # 60 req/hour rate limit on api.github.com.
    volumes:
      - uploads_data:/app/uploads
      - private_data:/app/private-data
      - app_logs:/var/log/app
      # ── Smart-updates deploy executor ────────────────────────────
      # Uncomment to let the Admin "Smart Updates" page run
      # `docker compose pull && up -d` against the host daemon.
      # Security note: mounting the docker socket grants the backend
      # container effective root on the host. Only enable on trusted
      # operator hosts where admins are already trusted to deploy.
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ncsms_net

  location-service:
    build:
      context: ./services/location_service
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOCATION_PROVIDER_URL: ${LOCATION_PROVIDER_URL:-https://ipwho.is/{ip}}
      LOCATION_PROVIDER_FALLBACK: ${LOCATION_PROVIDER_FALLBACK:-false}
      LOCATION_CACHE_TTL_SECONDS: ${LOCATION_CACHE_TTL_SECONDS:-86400}
      GEOIP_DB_PATH: /data/GeoLite2-City.mmdb
      GEO_WHITELIST_PATH: /config/geo-whitelist.json
      GEO_ALLOWED_COUNTRIES: ${GEO_ALLOWED_COUNTRIES:-UG}
      GEO_FAIL_CLOSED: ${GEO_FAIL_CLOSED:-false}
      GEO_UPSTREAM_URL: http://backend:8080
      GEO_FRONTEND_URL: http://frontend:80
    volumes:
      - geoip_data:/data
      - ./services/location_service/config:/config:ro
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ncsms_net]

  nsmis-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/nsmis-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ncsms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ncsms}?sslmode=disable
      PRIVATE_STORAGE_PATH: /app/private-data
    volumes:
      - private_data:/app/private-data
      - app_logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "pidof nsmis-worker > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ncsms_net]

  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/ncs-ops-agent"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ncsms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ncsms}?sslmode=disable
      BACKUP_DIR: /var/backups/ncs
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - backups_data:/var/backups/ncs
      - app_logs:/var/log/app
      - ${RCLONE_CONFIG_PATH:-./ops/backup/rclone.empty.conf}:/root/.config/rclone/rclone.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof ncs-ops-agent > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [ncsms_net]

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=14d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    networks: [ncsms_net]

  grafana:
    image: grafana/grafana:12.0.1
    restart: unless-stopped
    profiles: ["observability"]
    depends_on: [prometheus]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    expose: ["3000"]
    networks: [ncsms_net]

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - location-service
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - uploads_data:/app/uploads:ro
      # Uncomment when SSL certs are available:
      # - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- -S http://localhost/ 2>&1 | grep -qE 'HTTP/[0-9.]+ [2345]' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ncsms_net

  # ── Frontend (Vue 3 + Vite) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ncsms_net

  # ── pgAdmin 4 ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@ncs.go.ug}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ncsms_net

volumes:
  postgres_data:
  nginx_logs:
  pgadmin_data:
  uploads_data:
  private_data:
  geoip_data:
  app_logs:
  backups_data:
  prometheus_data:
  grafana_data:

networks:
  ncsms_net:
    driver: bridge
