name: ncswebsite

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncswebsite}
      POSTGRES_USER: ${POSTGRES_USER:-ncswebsite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - website_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncswebsite_user} -d ${POSTGRES_DB:-ncswebsite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ncswebsite_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ncswebsite_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ncswebsite}?sslmode=disable
      PORT: 8080
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:9080}
    volumes:
      - website_uploads_data:/app/uploads
      - website_private_data:/app/private-data
      - website_app_logs:/var/log/app
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [ncswebsite_net]

  location-service:
    build:
      context: ./services/location_service
    restart: unless-stopped
    env_file: [.env]
    environment:
      GEO_UPSTREAM_URL: http://backend:8080
      GEO_FRONTEND_URL: http://frontend:80
      GEOIP_DB_PATH: /data/GeoLite2-City.mmdb
      GEO_WHITELIST_PATH: /config/geo-whitelist.json
    volumes:
      - website_geoip_data:/data
      - ./services/location_service/config:/config:ro
    expose: ["8090"]
    networks: [ncswebsite_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9080}
        VITE_INTRANET_URL: ${VITE_INTRANET_URL:-http://localhost:9081}
    restart: unless-stopped
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ncswebsite_net]

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on: [backend, frontend, location-service]
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - website_nginx_logs:/var/log/nginx
      - website_uploads_data:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- -S http://127.0.0.1/ 2>&1 | grep -qE 'HTTP/[0-9.]+ [2345]' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ncswebsite_net]

volumes:
  website_postgres_data:
  website_nginx_logs:
  website_uploads_data:
  website_private_data:
  website_geoip_data:
  website_app_logs:

networks:
  ncswebsite_net:
    driver: bridge
