name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ncsportal_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
    volumes:
      - portal_uploads_data:/app/uploads
      - portal_private_data:/app/private-data
      - portal_app_logs:/var/log/app
      - portal_backups_data:/var/backups/ncs
    expose: ["${PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PORT}/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [ncsportal_net]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/nsmis-worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - portal_backups_data:/var/backups/ncs
    networks: [ncsportal_net]

  location-service:
    build:
      context: ./services/location_service
    restart: unless-stopped
    env_file: [.env]
    environment:
      GEO_UPSTREAM_URL: ${BACKEND_INTERNAL_URL}
      GEO_FRONTEND_URL: ${FRONTEND_INTERNAL_URL}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH}
      GEO_WHITELIST_PATH: ${GEO_WHITELIST_PATH}
    volumes:
      - portal_geoip_data:/data
      - ./services/location_service/config:/config:ro
    expose: ["8090"]
    networks: [ncsportal_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Left empty by default: nginx proxies frontend + API from the same
        # origin, so a relative base URL works on any host (localhost, LAN IP,
        # a domain) without rebuilding. Only set these if the API or intranet
        # genuinely live on a different origin than the site itself.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_INTRANET_URL: ${VITE_INTRANET_URL}
        VITE_API_PORT: ${VITE_API_PORT}
        VITE_INTRANET_PORT: ${VITE_INTRANET_PORT}
    restart: unless-stopped
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ncsportal_net]

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on: [backend, frontend, location-service]
    env_file: [.env]
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - "${NGINX_HOST_HTTP_PORT}:${NGINX_LISTEN_PORT}"
      - "${NGINX_HOST_HTTPS_PORT}:${NGINX_HTTPS_PORT}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/conf.d/proxy_params.conf:/etc/nginx/templates/proxy_params.conf.template:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - portal_nginx_logs:/var/log/nginx
      - portal_uploads_data:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- -S http://127.0.0.1/ 2>&1 | grep -qE 'HTTP/[0-9.]+ [2345]' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ncsportal_net]

volumes:
  portal_postgres_data:
  portal_nginx_logs:
  portal_uploads_data:
  portal_private_data:
  portal_geoip_data:
  portal_app_logs:
  portal_backups_data:

networks:
  ncsportal_net:
    driver: bridge
