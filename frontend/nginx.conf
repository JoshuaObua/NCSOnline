server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $website_gateway "http://ncswebsite-nginx-1:80";
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed assets — cache forever
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

  # index.html (and SPA fallback) — never cache, so chunk-hash references stay fresh
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;
    try_files $uri =404;
  }

  # Port 3000 exposes this frontend container directly. Forward every dynamic
  # website path to the main gateway so CMS navigation, slideshows, page data,
  # uploads, portal statistics, and health checks behave exactly like port 9080.
  location ~ ^/(api|uploads|portal-api)(/|$) {
    proxy_pass $website_gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/healthz?$ {
    proxy_pass $website_gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;
    try_files $uri $uri/ /index.html;
  }
}
